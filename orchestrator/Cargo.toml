[workspace]
resolver = "3"
members = ["core", "cli", "app"]

# The version here is the ORCHESTRATOR's, and it is deliberately not a git tag.
#
# build.gradle:1555 derives the mod's version with `git describe --abbrev=0 --tags` and no --match
# filter, so it takes the most recent tag of any name. A tag like `app-0.1.0` in this repository
# would silently become the MOD's version and land in its jar manifest, mcmod.info and
# McmcpConstants.MOD_VERSION. build.gradle is the GregTechCEu buildscript verbatim and must not be
# edited (see CLAUDE.md), so the convention carries the constraint instead:
#
#   mod releases tag YYYY.MM.DD          <- the only tags this repository ever gets
#   orchestrator releases bump this line <- no tag, ever
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1"
repository = "https://github.com/Mica-Technologies/MCMCP"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps object keys in the order they arrived. This is a proxy: tool schemas pass
# through it on their way to a model, and reordering their keys on every hop would produce a
# needlessly unstable tool catalogue.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# The orchestrator is a long-lived desktop process sitting next to two or three modded Minecraft
# instances. It should be small and quiet, not fast at any cost.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
