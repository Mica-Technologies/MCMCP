site_name: MCMCP Wiki
site_description: >-
  MCMCP — a Model Context Protocol server embedded in Minecraft 1.12.2 Forge, exposing a running
  game client or dedicated server to any MCP client.
site_url: https://mica-technologies.github.io/MCMCP/
repo_url: https://github.com/Mica-Technologies/MCMCP
repo_name: Mica-Technologies/MCMCP
edit_uri: edit/main/docs/
copyright: >-
  MCMCP is licensed under the LGPL 2.1. Documentation is part of the MCMCP repository.

# Agent working notes and phased plans are gitignored working documents, not published material.
# They are absent from a CI checkout anyway; this keeps a LOCAL `mkdocs serve` from picking them
# up and quietly publishing them on the next deploy.
exclude_docs: |
  AGENT-PLANS/
  agent-plans/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    # Indigo reads as tooling rather than as Minecraft, which is the right signal: this is a
    # developer-facing protocol server that happens to live inside a game.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Renders :material-…: / :octicons-…: shortcodes as inline SVG icons. Without this they render
  # as literal colon-wrapped text, which is what a missing icon looks like on a card.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - API explorer: api-explorer.md
  - Guides:
      - Installation: guide/installation.md
      - Connecting a client: guide/connecting.md
      - Client vs server endpoint: guide/endpoints.md
      - Running several instances: guide/orchestrator.md
      - Security model: guide/security.md
      - Debugging workflows: guide/debugging.md
  - Reference:
      - Tools: reference/tools.md
      - Resources: reference/resources.md
      - Prompts: reference/prompts.md
      - Configuration: reference/configuration.md
      - Commands: reference/commands.md
      - Protocol support: reference/protocol.md
  - Development:
      - Building: dev/building.md
      - Architecture: dev/architecture.md
      - Extending MCMCP: dev/extending.md
      - Testing: dev/testing.md
