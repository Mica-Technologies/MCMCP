org.gradle.logging.stacktrace = all
org.gradle.jvmargs = -Xmx3G
enableJUnit = true

# Disable the GTCEu buildscript's configuration-time "is a newer build.gradle available?" check.
# It fetches raw.githubusercontent.com during project evaluation, which has timed out and hard-failed
# CI in sibling repos (SocketTimeoutException at build.gradle:1454). We don't want the auto-update
# anyway — it would overwrite build.gradle and wipe the addon.gradle customisations. Run
# `gradle updateBuildScript` manually if a buildscript refresh is ever wanted. (systemProp.* is what
# the script's Boolean.getBoolean('DISABLE_BUILDSCRIPT_UPDATE_CHECK') guard actually reads.)
systemProp.DISABLE_BUILDSCRIPT_UPDATE_CHECK = true
