name: Test Mod Build

on:
  pull_request:
  # Also on direct pushes to main. Early in a project's life not everything arrives through a PR,
  # and a workflow that only fires on pull_request means the server smoke test — the only check
  # that proves the mod can load on a dedicated server and that the MCP endpoint actually serves a
  # handshake — silently never runs. The release workflow builds and publishes regardless, so
  # without this a broken server-side jar would ship with a green tick next to it.
  push:
    branches: [ main ]
  # Manual re-run, for reproducing a flaky startup without pushing a commit.
  workflow_dispatch:

# Superseded runs on the same ref are pointless — the server smoke test is slow. On a push the
# pull_request context is empty, so the group falls back to the workflow name, which is the
# behaviour we want there anyway: a newer commit on main supersedes the older one's test.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RFG runs the Gradle process on Java 21+ (compiler and mod code stay on Java 8 via Jabel);
      # older Gradle-JVM versions are deprecated and slated for removal.
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test/
          retention-days: 7

  server_smoke_test:
    name: Dedicated Server & MCP Handshake
    needs: compile
    runs-on: ubuntu-latest
    # World gen on a cold cache is the slow part; the script has its own inner budget.
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # A green `./gradlew build` proves nothing about the two things that actually break this mod:
      #
      #  1. Whether it can LOAD on a dedicated server. MCMCP is deliberately full of client-only
      #     code — ClientThreadBridge, the screenshot and input tools — and the only thing keeping
      #     it off the server is the proxy split. One import of a client class from common code
      #     compiles cleanly and kills the server at startup with "for invalid side SERVER".
      #
      #  2. Whether the MCP endpoint works. Unit tests cover the wire format with no socket; they
      #     cannot tell you the transport binds, enforces its token, negotiates a version, or lists
      #     the right tools for the side it is on.
      #
      # The script drives the same sequence a real MCP client does, against a real server.
      - name: Boot dedicated server and drive an MCP handshake
        run: bash .github/scripts/server-smoke-test.sh
        env:
          SMOKE_TIMEOUT: '900'

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log
          path: server-smoke.log
          retention-days: 7
