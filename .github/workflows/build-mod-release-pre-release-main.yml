name: Build Mod Release/Pre-Release (Main Branch)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a full release'
        required: false
        default: 'false'

jobs:
  assemble_release:
    name: Build Mod and Publish Release/Pre-Release
    runs-on: ubuntu-latest
    # The orchestrator job attaches its binaries to whatever tag this job created. It cannot
    # recompute the tag itself — the pre-release form contains a timestamp, so a second computation
    # would land on a different tag and silently publish to nothing.
    outputs:
      tag: ${{ steps.publish_tag.outputs.tag }}
      mod_version: ${{ env.MOD_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RFG runs the Gradle process on Java 21+ (compiler + mod code stay Java 8 via
      # Jabel); older Gradle-JVM Java versions are deprecated and slated for removal.
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Create Version Numbers
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

          # Calculate 'final' version number (YYYY.MM.DD).
          # If a release tag already exists for today, append SemVer 2.0
          # build metadata (+N) so subsequent same-day releases stay unique
          # without inventing a non-SemVer 4th segment.
          baseVersion=$(date -u +'%Y.%m.%d')
          git fetch --tags --quiet origin || true
          relVersion="$baseVersion"
          maxN=-1
          if git rev-parse -q --verify "refs/tags/$baseVersion" >/dev/null 2>&1; then
            maxN=0
          fi
          for existingTag in $(git tag -l "${baseVersion}+*"); do
            suffix="${existingTag#${baseVersion}+}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && [ "$suffix" -gt "$maxN" ]; then
              maxN="$suffix"
            fi
          done
          if [ "$maxN" -ge 0 ]; then
            relVersion="${baseVersion}+$((maxN + 1))"
          fi
          echo "REL_TAG=$relVersion" >> $GITHUB_ENV

          # Calculate 'pre-release' version number (YYYY.MM.DD-pre.hhmm.shorttz+COMMITSHORTSHA)
          preReleaseVersion=$(date -u +'%Y.%m.%d-pre.%H%M.%Z%z')"+$calculatedSha"
          echo "PRE_TAG=$preReleaseVersion" >> $GITHUB_ENV

      - name: Create Release Tag
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release }}
        run: |
          git tag "${{ env.REL_TAG }}" "${{ github.sha }}"
          git push origin "${{ env.REL_TAG }}"

      - name: Create Pre-Release Tag
        if: ${{ github.event.inputs.release == 'false' || !github.event.inputs.release }}
        run: |
          git tag "${{ env.PRE_TAG }}" "${{ github.sha }}"
          git push origin "${{ env.PRE_TAG }}"

      - name: Publish Which Tag Was Used
        id: publish_tag
        run: |
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            echo "tag=${{ env.REL_TAG }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ env.PRE_TAG }}" >> "$GITHUB_OUTPUT"
          fi

      # State the version instead of letting the build infer it.
      #
      # Left to itself the build takes it from `git describe --abbrev=0 --tags` (build.gradle:1553),
      # which has no --match and, with several tags on one commit, does not prefer the one just
      # created. A push to main tags the commit as a pre-release before anyone dispatches a release,
      # so two tags sit on it. Within one UTC day `2026.09.08` sorts ahead of
      # `2026.09.08-pre.1916...` and the release wins by luck; dispatch after midnight UTC and
      # `2026.09.08-pre.2007...` sorts ahead of `2026.09.09` instead. That shipped a release whose
      # jar, orchestrator archives and installers were all stamped with the pre-release version --
      # and whose installers were therefore a semver pre-release of the version already installed,
      # which no machine would take as an upgrade.
      #
      # buildscript.properties rather than `-PmodVersion`, which reads like the escape hatch
      # build.gradle:329 implies and is not one: loadProjectProperties (build.gradle:1494) copies
      # every key of this file over the project properties unconditionally, so whatever -P supplied
      # is overwritten by the empty value here. Writing the file is therefore the supported way in,
      # and it is a CI-only edit that is never committed.
      - name: Pin the mod version to the tag being published
        run: |
          chosen="${{ steps.publish_tag.outputs.tag }}"
          sed -i "s|^modVersion =.*|modVersion = $chosen|" buildscript.properties
          grep -n '^modVersion' buildscript.properties

      # Still worth doing with the version pinned, because `getLastTag` also feeds the generated
      # changelog (build.gradle:1170), which asks git the same ambiguous question. Do not remove it
      # as redundant.
      - name: Leave only the tag being built on this commit
        run: |
          chosen="${{ steps.publish_tag.outputs.tag }}"
          # The `|| true` is load-bearing: grep exits 1 when the chosen tag is the only one on the
          # commit, which is the ordinary case for a pre-release build. This step inherits the
          # workflow default of `bash -e`, where a non-zero exit mid-pipeline is ignored — but a step
          # that declares `shell: bash` also gets `-o pipefail`, where the same line fails the whole
          # release. Written to survive either, because this is a pattern worth copying to the other
          # repositories on the same buildscript and it must not depend on that distinction.
          others="$(git tag --points-at "${{ github.sha }}" | grep -vxF "$chosen" || true)"
          if [ -n "$others" ]; then
            echo "$others" | xargs git tag -d
          fi
          echo "Local tags now on this commit:"
          git tag --points-at "${{ github.sha }}"

      - name: Assemble Mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

      # `| tail -n 1`: these values are pasted into a filename by the publish step below, so any
      # stray stdout line corrupts the release. Gradle prints banners during project evaluation
      # even under -q, and a sibling repo's release died exactly this way when the buildscript
      # update check announced itself and the publish step ran
      # `cp ./build/libs/Build script update available!...`. That specific check is suppressed via
      # systemProp.DISABLE_BUILDSCRIPT_UPDATE_CHECK in gradle.properties; this guards against the
      # next banner nobody predicted.
      - name: Save Mod Name to GITHUB_ENV
        run: |
          modName=$(${{github.workspace}}/gradlew -q printModName | tail -n 1 | xargs)
          echo "MOD_NAME=$modName" >> $GITHUB_ENV

      - name: Save Mod Version to GITHUB_ENV
        run: |
          modVersion=$(${{github.workspace}}/gradlew -q printModVersion | tail -n 1 | xargs)
          echo "MOD_VERSION=$modVersion" >> $GITHUB_ENV

      # The mod version comes from the most recent git tag of ANY name (build.gradle:1555 uses
      # `git describe` with no --match). This repository also holds the orchestrator, whose releases
      # would very reasonably be tagged `app-0.1.0` by anybody who had not read the comment saying
      # not to — and the resulting jar would ship claiming that version, silently.
      - name: Check the mod version looks like a mod version
        run: bash .github/scripts/check-mod-version.sh "${{ env.MOD_VERSION }}"

      # The check above asks whether the version has a plausible *shape*, which is why it did not
      # catch a release built as `2026.09.08-pre.2007.UTC+0000+a306a0a`: that is a perfectly
      # well-formed version, just not the one being published. This asks the other question — is it
      # the version we said we were publishing — and it is the one that fails a release loudly
      # instead of shipping artifacts labelled as something else.
      - name: Fail if the built version is not the tag being published
        run: |
          built="${{ env.MOD_VERSION }}"
          chosen="${{ steps.publish_tag.outputs.tag }}"
          if [ "$built" != "$chosen" ]; then
            echo "::error::Built version '$built' does not match the published tag '$chosen'. The jar, the orchestrator archives and the installers would all be stamped '$built'. Refusing to publish."
            exit 1
          fi
          echo "Built version matches the published tag: $built"

      - name: Save Mod Archive Base Name to GITHUB_ENV
        run: |
          modArchiveBaseName=$(${{github.workspace}}/gradlew -q printArchivesBaseName | tail -n 1 | xargs)
          echo "MOD_ARCHIVE_BASE_NAME=$modArchiveBaseName" >> $GITHUB_ENV

      - name: Save Minecraft Version to GITHUB_ENV
        run: |
          minecraftVersion=$(${{github.workspace}}/gradlew -q printMinecraftVersion | tail -n 1 | xargs)
          echo "MINECRAFT_VERSION=$minecraftVersion" >> $GITHUB_ENV

      - name: Copy Assembled Mod Jar to GitHub Actions Workspace
        run: cp ./build/libs/${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar ./

      - name: Calculate Hashes for the Jar
        id: calculate-hashes
        run: |
          sha1=$(sha1sum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar | awk '{print $1}')
          md5=$(md5sum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar | awk '{print $1}')
          sha256=$(sha256sum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar | awk '{print $1}')
          crc32=$(cksum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar | awk '{print $1}')
          echo "SHA1_HASH=$sha1" >> $GITHUB_ENV
          echo "MD5_HASH=$md5" >> $GITHUB_ENV
          echo "SHA256_HASH=$sha256" >> $GITHUB_ENV
          echo "CRC32_HASH=$crc32" >> $GITHUB_ENV

      - name: Create Release Entry
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.REL_TAG }}
          name: Release ${{ env.MOD_VERSION }} (${{ env.MINECRAFT_VERSION }})
          body: |
            Release of ${{ env.MOD_NAME }}
            Mod Version: ${{ env.MOD_VERSION }}
            Game Version: ${{ env.MINECRAFT_VERSION }}

            SHA-1: `${{ env.SHA1_HASH }}`
            SHA-256: `${{ env.SHA256_HASH }}`
            MD5: `${{ env.MD5_HASH }}`
            CRC-32: `${{ env.CRC32_HASH }}`
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar

      - name: Create Pre-Release Entry
        if: ${{ github.event.inputs.release == 'false' || !github.event.inputs.release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.PRE_TAG }}
          name: Pre-Release ${{ env.MOD_VERSION }} (${{ env.MINECRAFT_VERSION }})
          body: |
            Pre-Release of ${{ env.MOD_NAME }}
            Mod Version: ${{ env.MOD_VERSION }}
            Game Version: ${{ env.MINECRAFT_VERSION }}

            SHA-1: `${{ env.SHA1_HASH }}`
            SHA-256: `${{ env.SHA256_HASH }}`
            MD5: `${{ env.MD5_HASH }}`
            CRC-32: `${{ env.CRC32_HASH }}`

            NOTICE: This is a pre-release version of the mod and is not
            guaranteed to be stable or permanently available for download/usage.
            Pre-release versions of ${{ env.MOD_NAME }} may be removed or unavailable after
            90 days from their initial release.
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar

  # ------------------------------------------------------------------------------------------
  # Orchestrator binaries
  # ------------------------------------------------------------------------------------------
  #
  # Attached to the SAME release as the mod jar, built from the SAME commit. That is a correctness
  # requirement, not tidiness: the mod and the orchestrator are two implementations of one link
  # protocol, and a release where they came from different commits is a release where they may not
  # agree on the wire. Shipping them together means whoever downloads a release gets two halves that
  # were tested against each other.
  #
  # Note what this job does NOT do: create a tag. build.gradle:1555 derives the mod's version with
  # `git describe --abbrev=0 --tags` and no --match filter, so ANY tag pushed to this repository
  # becomes the mod's version. A tag like `app-0.1.0` would silently rewrite the jar manifest,
  # mcmod.info and McmcpConstants.MOD_VERSION. The orchestrator's version lives in
  # orchestrator/Cargo.toml and is never a tag.
  orchestrator_binaries:
    name: Orchestrator (${{ matrix.target }})
    needs: assemble_release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # One platform failing must not stop the other two from publishing. A release with two of
      # three binaries is worth far more than a release with none.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Cross-compiled from the ARM runner rather than built on macos-13.
          #
          # macos-13 is GitHub's Intel image, and it is being retired — a job requesting it sat
          # queued for 45 minutes on the first release with no runner ever picking it up. Apple
          # Silicon runners are plentiful and can target x86_64 directly, so this is both faster and
          # not dependent on hardware that is going away.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestrator
          key: ${{ matrix.target }}

      # Tauri renders through the system webview. Windows has WebView2 and macOS has WKWebView; on
      # Linux the webkit2gtk development headers have to be installed or the app will not link.
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # `cargo install` rather than a prebuilt-binary action. It costs a couple of minutes per
      # platform, in parallel so wall clock barely moves, and it cannot fail because a third-party
      # action's supported-tool list changed. A release job should be boring.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      # The app carries the date it was built from, like the jar beside it in the release.
      #
      # It is written here rather than committed because the shape the installers accept is not the
      # shape the mod uses: an MSI major number may not exceed 255, so 2026.08.26 becomes 26.8.26 and
      # a pre-release's hhmm becomes a numeric pre-release identifier. Deriving it from MOD_VERSION
      # keeps one source of truth and means the app in a release always matches the jar it shipped
      # with — and, more to the point, that consecutive builds differ at all, which is what an
      # installer needs before it will treat one as an upgrade of the other.
      - name: Set the app version from the mod version
        run: bash .github/scripts/orchestrator-version.sh "${{ needs.assemble_release.outputs.mod_version }}" --write

      # The headless binary and the shim are the same executable, and the shim is what an MCP client
      # spawns — so it ships beside the app rather than instead of it.
      - name: Build the headless orchestrator
        working-directory: orchestrator
        run: cargo build --release --target ${{ matrix.target }} -p mcmcp-orchestrator

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          name="mcmcp-orchestrator-${{ needs.assemble_release.outputs.mod_version }}-${{ matrix.target }}"
          staging="$(mktemp -d)/$name"
          mkdir -p "$staging"
          cp orchestrator/target/${{ matrix.target }}/release/mcmcp-orchestrator "$staging/"
          cp LICENSE.txt "$staging/" 2>/dev/null || true
          cp docs/guide/orchestrator.md "$staging/README.md" 2>/dev/null || true
          tar -czf "$name.tar.gz" -C "$(dirname "$staging")" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "mcmcp-orchestrator-${{ needs.assemble_release.outputs.mod_version }}-${{ matrix.target }}"
          $staging = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "orchestrator/target/${{ matrix.target }}/release/mcmcp-orchestrator.exe" $staging
          if (Test-Path "LICENSE.txt") { Copy-Item "LICENSE.txt" $staging }
          if (Test-Path "docs/guide/orchestrator.md") { Copy-Item "docs/guide/orchestrator.md" (Join-Path $staging "README.md") }
          Compress-Archive -Path $staging -DestinationPath "$name.zip" -Force
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Attached BEFORE the installers are built, on purpose.
      #
      # Bundling is the step most likely to fail on a platform nobody has exercised, and with
      # continue-on-error gone a failure there ends the job. Publishing the binary first means such
      # a failure costs only that platform's installers, not its binary as well — while the job
      # still goes red so somebody notices.
      - name: Attach the headless binary to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.assemble_release.outputs.tag }}
          files: ${{ env.ASSET }}

      # The app cannot serve MCP over stdio, so an MCP client spawns the shim instead — and the
      # app's own Settings panel hands out a configuration pointing at it *next to the app*.
      # Bundling the app without the shim produces an install that looks complete and points its
      # configuration at a file that is not there. The first installer build did exactly that,
      # because nothing had ever run it.
      - name: Stage the shim for bundling
        run: bash .github/scripts/stage-orchestrator-sidecar.sh ${{ matrix.target }} release

      # Installers, not just an executable. This is what "cross-platform app" has to mean for
      # somebody who is not going to run cargo.
      #
      # No continue-on-error. It was here while this path had never been executed, and all it bought
      # was a release that published a jar, published binaries, shipped no installers, and stayed
      # green. fail-fast is off on the matrix, so one platform failing still lets the others publish.
      - name: Build the desktop app installers
        working-directory: orchestrator
        run: cargo tauri build --target ${{ matrix.target }} --config app/tauri.conf.json

      - name: Collect installers
        id: installers
        shell: bash
        run: |
          # Where tauri-bundler puts things varies by platform, so gather rather than guess. Missing
          # is not fatal: a release with the headless binary and no installer is still a release.
          mkdir -p dist
          bundle="orchestrator/target/${{ matrix.target }}/release/bundle"
          if [ -d "$bundle" ]; then
            find "$bundle" -type f \
              \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -exec cp {} dist/ \;
          fi
          count=$(find dist -type f | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Collected $count installer(s):"
          ls -la dist/ || true

          # A bundle step that succeeded but produced nothing is the same outcome as one that
          # failed, and is harder to notice.
          if [ "$count" -eq 0 ]; then
            echo "==> FAIL: the bundler reported success but produced no installers."
            echo "    Expected something under $bundle"
            exit 1
          fi

      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.assemble_release.outputs.tag }}
          # Installers are UNSIGNED. A deliberate deferral for a personal tool — a certificate costs
          # money annually — which means Windows SmartScreen and macOS Gatekeeper will both
          # complain. Nothing here precludes signing later: tauri-bundler takes signing
          # configuration, so it becomes a config addition and a secret rather than a rewrite.
          files: dist/*
